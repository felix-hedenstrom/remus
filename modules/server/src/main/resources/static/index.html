<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drakar och Demoner</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      padding: 1rem;
      max-width: 960px;
      margin-inline: auto;
    }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    section {
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 0.5rem; }
    .field-narrow { max-width: 8rem; }
    label { font-size: 0.85rem; opacity: 0.8; }
    input[type="text"], input[type="password"], input[type="number"], textarea {
      font-size: 1rem;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
      background: transparent;
      color: inherit;
    }
    .checkbox-field { display: inline-flex; align-items: center; gap: 0.3rem; margin-right: 1rem; font-size: 0.9rem; }
    button {
      font-size: 0.95rem;
      padding: 0.35rem 0.8rem;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
      background: transparent;
      color: inherit;
      cursor: pointer;
      margin-right: 0.4rem;
    }
    button.active { font-weight: bold; text-decoration: underline; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .attribute, .resource { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
    .attribute-name, .resource-name { width: 4rem; font-weight: bold; }
    .attribute-value, .resource-value { width: 4rem; }
    .skills-grid { display: grid; grid-template-columns: 1fr; gap: 0.2rem; margin-bottom: 0.5rem; }
    .skill-row { display: flex; align-items: center; gap: 0.5rem; }
    .skill-name { flex: 1; }
    .skill-attr { opacity: 0.6; width: 3rem; }
    .skill-value, .weapon-row input, .item-row input, .secondary-skill-row input { width: auto; }
    .weapon-row, .item-row, .secondary-skill-row { display: flex; gap: 0.4rem; margin-bottom: 0.3rem; align-items: center; }
    .character-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.4rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
    .character-row .name { font-weight: bold; min-width: 10rem; }
    .character-row .meta { opacity: 0.7; flex: 1; }
    .error-banner { display: flex; justify-content: space-between; align-items: center; background: #c0392b; color: white; padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .error-banner button { color: white; border-color: white; }
    .mode-toggle { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/main.js"></script>
</body>
</html>
